services:
  - type: web
    name: billie-jean-law
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: ADMIN_KEY
        sync: false
